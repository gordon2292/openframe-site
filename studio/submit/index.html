<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenFrame Studio｜首帧</title><link rel="stylesheet" href="../app.css"></head><body><div class="shell"><header class="top"><a class="brand" href="../../"><span class="mark"></span><span>OpenFrame<br><span data-i18n="brand">首帧 Studio</span></span></a><div class="top-actions"><span class="test" data-i18n="test">封闭测试版</span><div class="studio-langs"><button data-lang="zh-Hans">简</button><button data-lang="zh-Hant">繁</button><button data-lang="en">EN</button></div><button class="signout" type="button" data-signout data-i18n="logout">退出登录</button></div></header><div class="layout"><aside class="side"><span class="label" data-i18n="dashboard">创作者工作台</span><a  href="../home/" data-i18n="home">概览</a><a class="active" href="../submit/" data-i18n="submit">提交内容</a><a  href="../submissions/" data-i18n="submissions">我的提交</a><a  href="../review/" data-i18n="review">管理员审核</a><a class="minor" href="../../rules/" data-i18n="rules">审核与平台规则 ↗</a><a class="minor" href="../../about/" data-i18n="about">关于首帧与联系 ↗</a><button class="signout" type="button" data-signout data-i18n="logout">退出登录</button></aside><main><div class="eyebrow" data-i18n="newOverline">NEW SUBMISSION</div><h1 data-i18n-html="submitTitle">提交一条<em>可验证的内容。</em></h1><p class="notice" data-i18n="notice"></p><form id="submissionForm" class="card form"><div class="fields"><label><span data-i18n="title">视频标题</span><input required name="title" maxlength="70" data-i18n-placeholder="titlePlaceholder" placeholder="例如：原子真的有颜色吗？"></label><label><span data-i18n="topic">内容领域</span><select required name="topic"><option value="" data-i18n="choose">请选择</option><option value="science" data-i18n="science">科学与自然</option><option value="life_skills" data-i18n="life">生活技能</option><option value="language" data-i18n="languageTopic">语言</option><option value="art_design" data-i18n="art">艺术与设计</option><option value="movement_health" data-i18n="movement">运动与健康</option></select></label><label><span data-i18n="age">适合年龄</span><select required name="age"><option value="" data-i18n="choose">请选择</option><option value="10-12">10–12</option><option value="13-15">13–15</option><option value="16-18">16–18</option></select></label><label><span data-i18n="language">视频语言</span><select required name="language"><option value="" data-i18n="choose">请选择</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="bilingual">Bilingual</option></select></label><label class="full"><span data-i18n="summary">一句简介</span><textarea required name="summary" maxlength="220" data-i18n-placeholder="summaryPlaceholder"></textarea></label><label class="full"><span data-i18n="source">原始出处或资料链接</span><input required type="url" name="source" placeholder="https://"></label></div><div class="upload"><label for="video" data-i18n="chooseVideo">选择视频文件 ＋</label><input required id="video" name="video" type="file" accept="video/mp4,video/webm"><p class="hint" id="fileHint" data-i18n="fileHint">建议：MP4、720p、60 秒以内。</p></div><label class="check"><input required type="checkbox"><span data-i18n="rights">我确认拥有发布权；资料链接真实有效；内容不含广告植入或面向未成年人的不当内容。</span></label><button class="button" type="submit" data-i18n="submitButton">保存提交并进入审核</button></form></main></div></div><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../i18n.js"></script><script src="../app.js"></script></body></html>
