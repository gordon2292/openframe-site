<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenFrame Studio｜首帧</title><link rel="stylesheet" href="../app.css"></head><body><div class="shell"><header class="top"><a class="brand" href="../../"><span class="mark"></span><span>OpenFrame<br>首帧 Studio</span></a><span class="test">封闭测试版</span></header><div class="layout"><aside class="side"><span class="label">创作者工作台</span><a  href="../home/">概览</a><a class="active" href="../submit/">提交内容</a><a  href="../submissions/">我的提交</a><a  href="../feed/">学生端预览</a><a  href="../review/">管理员审核</a><a class="minor" href="../../rules/">审核与平台规则 ↗</a><a class="minor" href="../../about/">关于首帧与联系 ↗</a></aside><main><div class="eyebrow">NEW SUBMISSION</div><h1>提交一条<em>可验证的内容。</em></h1><p class="notice">目前为浏览器内演示：提交记录会显示在本机“我的提交”中，但不会上传到服务器。连接正式储存空间后，字段与审核流程会保留。</p><form id="submissionForm" class="card form"><div class="fields"><label>视频标题<input required name="title" maxlength="70" placeholder="例如：原子真的有颜色吗？"></label><label>内容领域<select required name="topic"><option value="">请选择</option><option>科学与自然</option><option>生活技能</option><option>语言</option><option>艺术与设计</option><option>运动与健康</option></select></label><label>适合年龄<select required name="age"><option value="">请选择</option><option>10–12 岁</option><option>13–15 岁</option><option>16–18 岁</option></select></label><label>视频语言<select required name="language"><option value="">请选择</option><option>简体中文</option><option>繁体中文</option><option>英文</option><option>中英双语</option></select></label><label class="full">一句简介<textarea required name="summary" maxlength="220" placeholder="告诉学生这条视频会解释什么，以及他们能带走什么。"></textarea></label><label class="full">原始出处或资料链接<input required type="url" name="source" placeholder="https://"></label></div><div class="upload"><label for="video">选择视频文件&nbsp; ＋</label><input id="video" type="file" accept="video/mp4,video/webm"><p class="hint" id="fileHint">建议：MP4、720p、60 秒以内。</p></div><label class="check"><input required type="checkbox">我确认拥有发布权；资料链接真实有效；内容不含广告植入或面向未成年人的不当内容。</label><button class="button" type="submit">保存提交并进入审核</button></form></main></div></div><div class="toast">已完成</div><script src="../app.js"></script></body></html>
