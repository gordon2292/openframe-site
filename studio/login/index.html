<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入｜OpenFrame Studio</title><link rel="stylesheet" href="../app.css"></head><body><div class="shell"><header class="top"><a class="brand" href="../../"><span class="mark"></span><span>OpenFrame<br>首帧 Studio</span></a><span class="test">封闭测试版</span></header><main class="login"><section class="login-box"><div class="eyebrow">CREATOR ACCESS</div><h1>进入你的<em>工作台。</em></h1><p class="intro">目前仅向受邀创作者开放。正式版将以邮箱验证码登入，不要求设置密码。</p><form id="access"><label>邮箱地址<input required type="email" placeholder="you@example.com"></label><button class="button" type="submit">继续</button></form><p class="fine">这是界面演示，不会收集或保存你填写的邮箱。</p></section></main></div><script>document.querySelector("#access").onsubmit=e=>{e.preventDefault();localStorage.setItem("openframe-demo-access","1");location.href="../home/"}</script></body></html>
