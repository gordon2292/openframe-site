"zh-Hans":{
back:"返回官网",hero:"先把标准<br><em>说清楚。</em>",lead:"此为首帧封闭测试期间的初版平台规则，包括相关审核机制，以及用户在平台内所享有的保护。",callout1:"首帧无法保证“内容一定正确”。我们鼓励用户透过多位创作者的作品获取不同类型的知识，并以此建立独立思考能力。",callout2:"我们要求创作者说明来源、经验范围与不确定之处，并保留审核、退回和下架内容的权利。",r1h:"内容基础要求",r1:"<li>每条知识类内容应附上原始出处、可访问的资料链接，或清晰标明内容来自个人经验。</li><li>标题、封面与讲述不应夸大结论或故意制造误导。</li><li>医学、心理、法律、投资等高风险主题，只可作基础常识介绍；不得给出个人诊断、处方、交易建议或鼓励危险行为。</li><li>内容需标明适合年龄、主要语言与所属主题。</li>",r2h:"不被允许的内容",r2:"<li>广告口播、带货链接、首帧平台以外的课程导流、未经说明的商业合作。</li><li>仇恨、羞辱、骚扰、暴力刺激内容，或涉及未成年人隐私与个人资料的内容。</li><li>未经授权使用的影视、音乐、图片或他人完整作品。</li><li>无法说明来源的“冷知识”、伪科学、明显错误信息，或以恐惧、焦虑推动观看的内容。</li>",r3h:"审核如何进行",r3p:"所有内容均经过人工审核；我们的审核流程亦已公布：",step1:"提交：视频与资料",step2:"初检：字段、来源、版权",step3:"人工审核：适龄与表达",step4:"结果：发布、退回或拒绝",r4h:"审核结果",r4:"<strong>发布：</strong>内容进入用户端平台，并显示资料来源入口。<br><strong>需要修改：</strong>创作者会收到需补足的项目，例如来源链接、年龄分级、版权说明或措辞调整。<br><strong>不予发布：</strong>内容不符合本页规则，或当前测试范围无法妥善处理该主题。",r5h:"用户端的互动与隐私",r5:"首版不会开放陌生人私信、公开定位、广告追踪或以个人资料换取推荐的机制。用户可以选择主题、兴趣与难度；平台会提供举报入口，并对被举报内容暂停展示或人工复核。",r6h:"规则如何更新",r6:"测试期间若我们修改审核范围或互动方式，会在本页标出版本和生效日期。涉及创作者已发布内容的重大调整，会通过已登记的联系邮箱说明。",legal:"首帧创始于香港，以香港作运营总部；本平台受香港法律监管。",contact:"关于规则的建议或问题："},
"zh-Hant":{
back:"返回官網",hero:"先把標準<br><em>說清楚。</em>",lead:"此為首幀封閉測試期間的初版平台規則，包括相關審核機制，以及用戶在平台內所享有的保護。",callout1:"首幀無法保證「內容一定正確」。我們鼓勵用戶透過多位創作者的作品獲取不同類型的知識，並以此建立獨立思考能力。",callout2:"我們要求創作者說明來源、經驗範圍與不確定之處，並保留審核、退回和下架內容的權利。",r1h:"內容基礎要求",r1:"<li>每條知識類內容應附上原始出處、可訪問的資料連結，或清晰標明內容來自個人經驗。</li><li>標題、封面與講述不應誇大結論或故意製造誤導。</li><li>醫學、心理、法律、投資等高風險主題，只可作基礎常識介紹；不得給出個人診斷、處方、交易建議或鼓勵危險行為。</li><li>內容需標明適合年齡、主要語言與所屬主題。</li>",r2h:"不被允許的內容",r2:"<li>廣告口播、帶貨連結、首幀平台以外的課程導流、未經說明的商業合作。</li><li>仇恨、羞辱、騷擾、暴力刺激內容，或涉及未成年人隱私與個人資料的內容。</li><li>未經授權使用的影視、音樂、圖片或他人完整作品。</li><li>無法說明來源的「冷知識」、偽科學、明顯錯誤資訊，或以恐懼、焦慮推動觀看的內容。</li>",r3h:"審核如何進行",r3p:"所有內容均經過人工審核；我們的審核流程亦已公布：",step1:"提交：影片與資料",step2:"初檢：欄位、來源、版權",step3:"人工審核：適齡與表達",step4:"結果：發布、退回或拒絕",r4h:"審核結果",r4:"<strong>發布：</strong>內容進入用戶端平台，並顯示資料來源入口。<br><strong>需要修改：</strong>創作者會收到需補足的項目，例如來源連結、年齡分級、版權說明或措辭調整。<br><strong>不予發布：</strong>內容不符合本頁規則，或當前測試範圍無法妥善處理該主題。",r5h:"用戶端的互動與隱私",r5:"首版不會開放陌生人私訊、公開定位、廣告追蹤或以個人資料換取推薦的機制。用戶可以選擇主題、興趣與難度；平台會提供舉報入口，並對被舉報內容暫停展示或人工覆核。",r6h:"規則如何更新",r6:"測試期間若我們修改審核範圍或互動方式，會在本頁標出版本和生效日期。涉及創作者已發布內容的重大調整，會透過已登記的聯絡電郵說明。",legal:"首幀創始於香港，以香港作營運總部；本平台受香港法律監管。",contact:"關於規則的建議或問題："},
"en":{
back:"Back to site",hero:"Set the standard<br><em>before we begin.</em>",lead:"These are OpenFrame’s first platform rules for closed testing. They describe review and the protections available to people using the platform.",callout1:"OpenFrame cannot guarantee that every claim is correct. We encourage users to learn from different creators and build their own judgement.",callout2:"Creators must state their sources, experience boundaries and uncertainty. We may review, return or remove content.",r1h:"Basic content requirements",r1:"<li>Knowledge content must include a primary source, an accessible reference link, or a clear statement that it comes from personal experience.</li><li>Titles, covers and presentation must not exaggerate a conclusion or mislead deliberately.</li><li>High-risk topics such as medicine, mental health, law and investing may only introduce basic knowledge. Personal diagnoses, prescriptions, trading advice and encouragement of dangerous behaviour are not allowed.</li><li>Content must state its suitable age range, main language and topic.</li>",r2h:"Content that is not allowed",r2:"<li>Advertisements, shopping links, course referrals outside OpenFrame, or undisclosed commercial partnerships.</li><li>Hate, humiliation, harassment, graphic violence, or material involving a minor’s privacy or personal data.</li><li>Films, music, images or complete works used without permission.</li><li>Unverifiable trivia, pseudoscience, clear misinformation, or content that uses fear or anxiety to drive viewing.</li>",r3h:"How review works",r3p:"Every submission is reviewed by a person. The process is public:",step1:"Submit: video and references",step2:"Initial check: fields, sources, copyright",step3:"Human review: age fit and expression",step4:"Outcome: publish, return or decline",r4h:"Review outcomes",r4:"<strong>Publish:</strong> the content enters the user experience with a source link.<br><strong>Revision requested:</strong> the creator receives the missing items, such as a source, age rating, copyright note or wording change.<br><strong>Declined:</strong> the content does not meet these rules, or the current test cannot handle its topic safely.",r5h:"Interaction and privacy",r5:"The first release will not offer messages from strangers, public location, advertising tracking or recommendations exchanged for personal data. Users choose topics, interests and difficulty. A report control is provided; reported content can be paused or reviewed again.",r6h:"How rules change",r6:"If we change review scope or interactions during testing, this page will show the version and effective date. Material changes affecting published work will be explained through the creator’s registered contact email.",legal:"OpenFrame began in Hong Kong and is operated from Hong Kong. This platform is governed by Hong Kong law.",contact:"Questions or suggestions about these rules:"}
